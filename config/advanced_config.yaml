# CyberGuard Advanced Configuration

# Enhanced Integration Configuration
integrations:
  # Threat Intelligence Feeds
  threat_intelligence:
    enabled: true
    update_interval: 3600  # 1 hour
    feeds:
      # Commercial Feeds (API keys required)
      commercial:
        threatconnect:
          enabled: false
          api_url: "https://api.threatconnect.com/v2"
          api_key: "${THREATCONNECT_API_KEY}"
          rate_limit: 100
        recorded_future:
          enabled: false
          api_url: "https://api.recordedfuture.com/v2"
          api_key: "${RECORDED_FUTURE_API_KEY}"
          rate_limit: 100
        anomali:
          enabled: false
          api_url: "https://api.anomali.com/v1"
          api_key: "${ANOMALI_API_KEY}"
          rate_limit: 100
        ibm_xforce:
          enabled: false
          api_url: "https://api.xforce.ibmcloud.com"
          api_key: "${IBM_XFORCE_API_KEY}"
          rate_limit: 100
        virustotal:
          enabled: true
          api_url: "https://www.virustotal.com/api/v3"
          api_key: "${VIRUSTOTAL_API_KEY}"
          rate_limit: 100
        otx:
          enabled: true
          api_url: "https://otx.alienvault.com/api/v1"
          api_key: "${OTX_API_KEY}"
          rate_limit: 100
      
      # Government Feeds (Public)
      government:
        nist_nvd:
          enabled: true
          rate_limit: 50
        us_cert:
          enabled: true
          rate_limit: 10
        cisa_aa22:
          enabled: true
          rate_limit: 10
      
      # Open Source Feeds (Public)
      open_source:
        abuse_ch:
          enabled: true
          rate_limit: 100
        alienvault_reputation:
          enabled: true
          rate_limit: 100
        spamhaus:
          enabled: true
          rate_limit: 100
        virusshare:
          enabled: true
          rate_limit: 50
        malshare:
          enabled: true
          api_key: "${MALSHARE_API_KEY}"
          rate_limit: 100
      
      # Industry-Specific Feeds
      industry_specific:
        financial:
          fs_isac:
            enabled: false
            api_url: "${FS_ISAC_API_URL}"
            api_key: "${FS_ISAC_API_KEY}"
            rate_limit: 50
        healthcare:
          hhs_cyber:
            enabled: true
            rate_limit: 10
        energy:
          energy_isac:
            enabled: false
            api_url: "${ENERGY_ISAC_API_URL}"
            api_key: "${ENERGY_ISAC_API_KEY}"
            rate_limit: 50
        automotive:
          automotive_isac:
            enabled: false
            api_url: "${AUTOMOTIVE_ISAC_API_URL}"
            api_key: "${AUTOMOTIVE_ISAC_API_KEY}"
            rate_limit: 50

  # Threat Hunting Configuration
  threat_hunting:
    enabled: true
    hunting_interval: 1800  # 30 minutes
    max_concurrent_hunts: 5
    platforms:
      splunk:
        enabled: false
        connection_string: "${SPLUNK_CONNECTION}"
      elk:
        enabled: false
        connection_string: "${ELK_CONNECTION}"
      qradar:
        enabled: false
        connection_string: "${QRADAR_CONNECTION}"

  # Commercial Platform Integrations
  commercial_platforms:
    enabled: true
    platforms:
      # Splunk SIEM
      splunk:
        enabled: false
        base_url: "${SPLUNK_BASE_URL}"
        username: "${SPLUNK_USERNAME}"
        password: "${SPLUNK_PASSWORD}"
        token: "${SPLUNK_TOKEN}"
        search_timeout: 60
        max_results: 1000
        hec_enabled: false
      
      # IBM QRadar
      qradar:
        enabled: false
        base_url: "${QRADAR_BASE_URL}"
        username: "${QRADAR_USERNAME}"
        password: "${QRADAR_PASSWORD}"
        version: "16.0"
        max_results: 1000
      
      # Microsoft Sentinel
      sentinel:
        enabled: false
        subscription_id: "${SENTINEL_SUBSCRIPTION_ID}"
        resource_group: "${SENTINEL_RESOURCE_GROUP}"
        workspace_name: "${SENTINEL_WORKSPACE_NAME}"
        client_id: "${SENTINEL_CLIENT_ID}"
        client_secret: "${SENTINEL_CLIENT_SECRET}"
        tenant_id: "${SENTINEL_TENANT_ID}"
      
      # AlienVault USM
      alienvault:
        enabled: false
        base_url: "${ALIENVAULT_BASE_URL}"
        username: "${ALIENVAULT_USERNAME}"
        password: "${ALIENVAULT_PASSWORD}"
        api_key: "${ALIENVAULT_API_KEY}"

  # Cloud Platform Integrations
  cloud_integration:
    enabled: true
    platforms:
      aws:
        enabled: false
        region: "us-east-1"
        access_key: "${AWS_ACCESS_KEY}"
        secret_key: "${AWS_SECRET_KEY}"
        services:
          guardduty: true
          security_hub: true
          waf: true
          cloudtrail: true
      
      azure:
        enabled: false
        subscription_id: "${AZURE_SUBSCRIPTION_ID}"
        tenant_id: "${AZURE_TENANT_ID}"
        client_id: "${AZURE_CLIENT_ID}"
        client_secret: "${AZURE_CLIENT_SECRET}"
        region: "eastus"
        services:
          security_center: true
          sentinel: true
      
      gcp:
        enabled: false
        project_id: "${GCP_PROJECT_ID}"
        credentials_path: "${GCP_CREDENTIALS_PATH}"
        region: "us-central1"
        services:
          security_command_center: true
          threat_detection: true

  # SIEM Integration
  siem:
    enabled: true
    splunk:
      enabled: false
      url: "${SPLUNK_SIEM_URL}"
      token: "${SPLUNK_SIEM_TOKEN}"
      index: "security"
    elk:
      enabled: false
      url: "${ELK_SIEM_URL}"
      username: "${ELK_SIEM_USERNAME}"
      password: "${ELK_SIEM_PASSWORD}"
    arcsight:
      enabled: false
      url: "${ARCSIGHT_SIEM_URL}"

# Detection Engine Configuration
detection:
  enabled: true
  scan_interval: 10
  sensitivity: "high"
  platforms:
    web:
      enabled: true
      urls:
        - "https://example.com"
        - "https://api.example.com"
      ports: [80, 443, 8080, 8443]
      protected_endpoints: ["/admin", "/api", "/login", "/wp-admin", "/phpmyadmin"]
      rate_limit: 1000
      block_threshold: 10
      advanced_detection:
        behavioral_analysis: true
        threat_intelligence_matching: true
        commercial_platform_correlation: true
    
    database:
      enabled: true
      connections:
        - name: "primary_db"
          type: "postgresql"
          host: "${DB_HOST}"
          port: 5432
          database: "${DB_NAME}"
          user: "${DB_USER}"
          password: "${DB_PASSWORD}"
      query_timeout: 30
      suspicious_patterns: ["drop", "delete", "union", "script", "xp_cmdshell", "sp_executesql"]
      connection_limit: 100
      advanced_detection:
        query_analysis: true
        behavioral_monitoring: true
        privilege_escalation_detection: true
    
    network:
      enabled: true
      ports: [21, 22, 23, 25, 53, 80, 110, 143, 443, 993, 995, 1433, 3306, 3389, 5432, 5900, 6379, 8080, 27017]
      protocols: ["tcp", "udp", "icmp"]
      intrusion_detection: true
      dos_protection: true
      advanced_detection:
        threat_intelligence_integration: true
        behavioral_baseline: true
        commercial_platform_monitoring: true
    
    application:
      enabled: true
      log_paths:
        - "/var/log/auth.log"
        - "/var/log/syslog"
        - "/var/log/apache2/access.log"
        - "/var/log/nginx/access.log"
      process_monitoring: true
      file_integrity: true
      privilege_escalation: true
      advanced_detection:
        behavioral_analysis: true
        threat_intelligence_correlation: true
        commercial_platform_integration: true

# Enhanced Response Engine
response:
  enabled: true
  auto_respond: true
  response_delay: 5
  escalation_threshold: "high"
  notification_channels:
    - "log"
    - "webhook"
    - "email"
    - "siem"
  quarantine_enabled: true
  rate_limiting_enabled: true
  advanced_actions:
    threat_intelligence_correlation: true
    commercial_platform_integration: true
    cloud_security_actions: true
    automated_hunting: true

# Machine Learning Configuration
ml:
  enabled: true
  behavioral_analysis:
    enabled: true
    learning_period_days: 7
    anomaly_threshold: 2.5
    min_data_points: 100
  threat_classification:
    enabled: true
    model_retrain_interval: 86400  # 24 hours
    confidence_threshold: 0.7
  false_positive_reduction:
    enabled: true
    feedback_learning: true

# Compliance and Governance
compliance:
  enabled: true
  frameworks:
    - "SOC2"
    - "ISO27001"
    - "NIST_CSF"
    - "PCI_DSS"
    - "GDPR"
  audit_logging: true
  retention_period_days: 2555  # 7 years
  immutable_storage: false

# Advanced Monitoring
monitoring:
  health_checks:
    enabled: true
    interval: 60
  performance_monitoring:
    enabled: true
    metrics_retention: 30  # days
  alerting:
    channels:
      - "email"
      - "webhook"
      - "slack"
      - "teams"
    escalation_rules: true

# General Configuration
general:
  log_level: "INFO"
  dashboard_port: 8080
  api_port: 8081
  dashboard_enabled: true
  dashboard_host: "localhost"
  data_retention_days: 30
  max_concurrent_scans: 10
  health_check_interval: 60
  
  # Advanced Settings
  advanced_features:
    threat_intelligence: true
    threat_hunting: true
    commercial_platforms: true
    machine_learning: true
    compliance_monitoring: true
  
  # Security Settings
  security:
    encryption_at_rest: false
    encryption_in_transit: true
    api_authentication: false
    audit_logging: true